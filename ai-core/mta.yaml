_schema-version: "3.3"
ID: uim-ai-core
version: 2.0.0
description: UIM AI Core — D/vibe.d backend (AI API v2, OData v4), SAP Fiori 3 / OpenUI5 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: ai-core-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun --compiler=ldc2
        - dub build --build=release --config=cli --compiler=ldc2
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-ai-core-platform-service build/uim-ai-core-cli dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-ai-core-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      AICORE_HOST: 0.0.0.0
      # The snapshot lives on the (ephemeral) container disk — single instance only.
      AICORE_STORAGE: file
      AICORE_DATA_FILE: data/ai-core.json
      AICORE_FRONTEND_DIR: ""
      AICORE_RECONCILE_INTERVAL_SECONDS: "5"
      AICORE_PUBLIC_URL: ${default-url}
    provides:
      - name: ai-core-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: ai-core-xsuaa
      - name: ai-core-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: ai-core-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: ai-core-xsuaa
      - name: ai-core-srv-api
        group: destinations
        properties:
          name: ai-core-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: ai-core-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-ai-core-${space}

  # Runtime overrides read from VCAP_SERVICES (credentials of the service named
  # "ai-core-config"), e.g. simulated runtime durations:
  #   cf update-user-provided-service ai-core-config -p '{"executionRunSeconds":120,"reconcileTenants":["default","t2"]}'
  - name: ai-core-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: ai-core-config
      config:
        reconcileTenants: ["default"]
