apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-core-config
  labels:
    app: ai-core
    part-of: uim-platform
data:
  AICORE_HOST: "0.0.0.0"
  AICORE_PORT: "8090"
  AICORE_STORAGE: "file"
  AICORE_DATA_FILE: "/data/ai-core.json"
  AICORE_FRONTEND_DIR: "/app/frontend"
  AICORE_RECONCILE_INTERVAL_SECONDS: "5"
  AICORE_RECONCILE_TENANTS: "default"
  AICORE_EXECUTION_RUN_SECONDS: "30"
