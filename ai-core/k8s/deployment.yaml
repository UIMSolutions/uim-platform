apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-core
  labels:
    app: ai-core
    part-of: uim-platform
spec:
  # file storage is a single-node snapshot — keep one replica
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-core
  template:
    metadata:
      labels:
        app: ai-core
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
      containers:
      - name: ai-core
        image: uim-platform/ai-core:latest
        ports:
        - containerPort: 8090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: ai-core-config
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
      volumes:
      - name: data
        emptyDir: {}
