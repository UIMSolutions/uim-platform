_schema-version: "3.3"
ID: uim-task-center
version: 2.0.0
description: UIM Task Center — D/vibe.d backend (REST + OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: task-center-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun --compiler=ldc2
        - dub build --build=release --config=cli --compiler=ldc2
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-task-center-platform-service build/uim-task-center-cli dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-task-center-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      TASK_CENTER_HOST: 0.0.0.0
      # The snapshot lives on the (ephemeral) container disk — single instance only.
      TASK_CENTER_STORAGE: file
      TASK_CENTER_DATA_FILE: data/task-center.json
      TASK_CENTER_FRONTEND_DIR: ""
      TASK_CENTER_SYNC_INTERVAL_SECONDS: "300"
    provides:
      - name: task-center-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: task-center-xsuaa
      - name: task-center-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: task-center-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: task-center-xsuaa
      - name: task-center-srv-api
        group: destinations
        properties:
          name: task-center-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: task-center-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-task-center-${space}

  # Optional runtime overrides read from VCAP_SERVICES (credentials of the
  # service named "task-center-config"), e.g. {"syncTenants": ["t1", "t2"]}
  - name: task-center-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: task-center-config
      config:
        syncTenants: ["default"]
