apiVersion: v1
kind: ConfigMap
metadata:
  name: task-center-config
  namespace: uim-platform
  labels:
    app: task-center
    part-of: uim-platform
data:
  TASK_CENTER_HOST: "0.0.0.0"
  TASK_CENTER_PORT: "8103"
  TASK_CENTER_STORAGE: "file"
  TASK_CENTER_DATA_FILE: "/data/task-center.json"
  TASK_CENTER_FRONTEND_DIR: "/app/frontend"
  TASK_CENTER_SYNC_INTERVAL_SECONDS: "300"
  TASK_CENTER_SYNC_TENANTS: "default"
  # TASK_CENTER_REQUIRE_AUTHENTICATION: "true"  (with TASK_CENTER_JWT_SECRET from a Secret)
