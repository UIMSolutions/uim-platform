apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-center
  namespace: uim-platform
  labels:
    app: task-center
    part-of: uim-platform
spec:
  replicas: 1 # file storage: one writer only
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: task-center
  template:
    metadata:
      labels:
        app: task-center
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: task-center
        image: uim-platform/task-center:latest
        ports:
        - containerPort: 8103
          protocol: TCP
        envFrom:
        - configMapRef:
            name: task-center-config
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8103
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8103
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      volumes:
      - name: data
        emptyDir: {} # replace with a PersistentVolumeClaim for durable tasks
