apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-manager
  namespace: uim-platform
  labels:
    app: service-manager
spec:
  # The JSON file store is single-writer: keep one replica (or plug in a
  # database backed IDocumentStore before scaling out).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: service-manager
  template:
    metadata:
      labels:
        app: service-manager
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
      containers:
      - name: service-manager
        image: uim-platform/service-manager:latest
        ports:
        - containerPort: 8113
        envFrom:
        - configMapRef:
            name: service-manager-config
        env:
        - name: SERVICE_MANAGER_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: service-manager-secrets
              key: jwtSecret
              optional: true
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8113
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8113
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: service-manager-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: service-manager-data
  namespace: uim-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
