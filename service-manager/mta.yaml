_schema-version: "3.3"
ID: uim-service-manager
version: 2.0.0
description: UIM Service Manager — D/vibe.d backend (REST + OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: service-manager-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun --compiler=ldc2
        - dub build --build=release --config=cli --compiler=ldc2
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-service-manager-platform-service build/uim-service-manager-cli dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-service-manager-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      SERVICE_MANAGER_HOST: 0.0.0.0
      SERVICE_MANAGER_FRONTEND_DIR: ""
      # The file store lives on the ephemeral container disk — bind a database
      # (IDocumentStore implementation) before storing real data.
      SERVICE_MANAGER_STORAGE: file
      SERVICE_MANAGER_DATA_FILE: data/service-manager.json
    provides:
      - name: service-manager-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: service-manager-xsuaa   # verificationkey → RS256 token validation + scope enforcement

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: service-manager-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: service-manager-xsuaa
      - name: service-manager-srv-api
        group: destinations
        properties:
          name: service-manager-srv
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: service-manager-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-service-manager-${space}
