_schema-version: "3.3"
ID: uim-architecture
version: 2.0.0
description: UIM architecture repository — D/vibe.d backend (REST, OData v4), SAP Fiori 3 / OpenUI5 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: architecture-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun --compiler=ldc2
        - dub build --build=release --config=cli --compiler=ldc2
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-architecture-platform-service build/uim-architecture-cli dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-architecture-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      ARCHITECTURE_HOST: 0.0.0.0
      # The snapshot lives on the (ephemeral) container disk — single instance only.
      ARCHITECTURE_STORAGE: file
      ARCHITECTURE_DATA_FILE: data/architecture.json
      ARCHITECTURE_FRONTEND_DIR: ""
      ARCHITECTURE_SEED_DEMO_DATA: "false"
    provides:
      - name: architecture-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: architecture-xsuaa
      - name: architecture-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: architecture-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: architecture-xsuaa
      - name: architecture-srv-api
        group: destinations
        properties:
          name: architecture-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: architecture-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-architecture-${space}

  # Runtime overrides read from VCAP_SERVICES (credentials of the service named
  # "architecture-config"), e.g. a demo space:
  #   cf update-user-provided-service architecture-config -p '{"seedDemoData":true}'
  - name: architecture-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: architecture-config
      config:
        seedDemoData: false
