_schema-version: "3.3"
ID: uim-document-ai
version: 2.0.0
description: UIM Document AI — D/vibe.d backend (REST, OData v4), SAP Fiori 3 / OpenUI5 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: document-ai-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun --compiler=ldc2
        - dub build --build=release --config=cli --compiler=ldc2
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-document-ai-platform-service build/uim-document-ai-cli dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-document-ai-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      DOCAI_HOST: 0.0.0.0
      # The snapshot lives on the (ephemeral) container disk — single instance only.
      DOCAI_STORAGE: file
      DOCAI_DATA_FILE: data/document-ai.json
      DOCAI_FRONTEND_DIR: ""
      # authentication: the XSUAA binding below switches the service to xsuaa mode
      DOCAI_AUTH_MODE: open
      DOCAI_EXTRACTION_MODE: simulate
    provides:
      - name: document-ai-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: document-ai-xsuaa
      - name: document-ai-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: document-ai-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: document-ai-xsuaa
      - name: document-ai-srv-api
        group: destinations
        properties:
          name: document-ai-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 120000

resources:
  - name: document-ai-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-document-ai-${space}

  # Runtime overrides read from VCAP_SERVICES (credentials of the service named
  # "document-ai-config"), e.g.:
  #   cf update-user-provided-service document-ai-config -p '{"extractionMode":"http","extractionUrl":"https://…","minConfidence":0.8}'
  - name: document-ai-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: document-ai-config
      config:
        workerTenants: ["default"]
