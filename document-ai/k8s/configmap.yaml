apiVersion: v1
kind: ConfigMap
metadata:
  name: document-ai-config
  labels:
    app: document-ai
    part-of: uim-platform
data:
  DOCAI_HOST: "0.0.0.0"
  DOCAI_PORT: "8096"
  DOCAI_STORAGE: "file"
  DOCAI_DATA_FILE: "/data/document-ai.json"
  DOCAI_FRONTEND_DIR: "/app/frontend"
  DOCAI_AUTH_MODE: "jwt"
  DOCAI_TOKEN_TTL_SECONDS: "3600"
  DOCAI_WORKER_INTERVAL_SECONDS: "5"
  DOCAI_MIN_CONFIDENCE: "0.7"
  DOCAI_MIN_TRAINING_DOCUMENTS: "3"
  DOCAI_TRAINING_SECONDS: "30"
  # simulate | http — http posts documents and schema fields to DOCAI_EXTRACTION_URL
  DOCAI_EXTRACTION_MODE: "simulate"
  DOCAI_EXTRACTION_URL: ""
