# Copy to secret.yaml (not committed), fill in, apply:
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: document-ai-secret
  labels:
    app: document-ai
type: Opaque
stringData:
  DOCAI_JWT_SECRET: "<at least 32 random characters, e.g. openssl rand -base64 48>"
  DOCAI_ADMIN_PASSWORD: "<initial password of the admin user (min. 10 characters)>"
  # optional: Authorization header for the extraction service (extractionMode http)
  DOCAI_EXTRACTION_AUTHORIZATION: "Bearer <token>"
