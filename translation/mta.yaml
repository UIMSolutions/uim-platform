_schema-version: "3.3"
ID: uim-translation
version: 1.0.0
description: UIM Translation Hub — D/vibe.d backend (REST + OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: translation-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-translation-platform-service dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-translation-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /api/v1/health
    properties:
      TRANSLATION_HOST: 0.0.0.0
      TRANSLATION_LOG_LEVEL: info
      # Snapshots live on the (ephemeral) container disk — bind a persistent
      # store before using this for real data.
      TRANSLATION_STORAGE: file
      TRANSLATION_DATA_DIR: data
      TRANSLATION_FRONTEND_DIR: ""
      TRANSLATION_JOB_INTERVAL: "5"
    provides:
      - name: translation-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: translation-xsuaa
      - name: translation-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: translation-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: translation-xsuaa
      - name: translation-srv-api
        group: destinations
        properties:
          name: translation-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: translation-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-translation-${space}

  # Optional runtime overrides read from VCAP_SERVICES (credentials of the
  # service named / tagged "translation-config"), e.g. {"providers": "mltr,machineMt"}
  - name: translation-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: translation-config
      config:
        jobTenants: default
        defaultProvider: machineMt
        maxBatchSize: "100"
