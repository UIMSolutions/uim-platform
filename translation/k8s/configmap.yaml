apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-translation-config
  labels:
    app: cloud-translation
    part-of: uim-platform
data:
  TRANSLATION_HOST: "0.0.0.0"
  TRANSLATION_PORT: "8096"
  TRANSLATION_LOG_LEVEL: "info"
  TRANSLATION_STORAGE: "file"
  TRANSLATION_DATA_DIR: "/app/data"
  TRANSLATION_DEFAULT_TENANT: "default"
  TRANSLATION_JOB_INTERVAL: "5"
  TRANSLATION_JOB_TENANTS: "default"
  TRANSLATION_PROVIDERS: "mltr,machineMt,companyMltr,llm"
  TRANSLATION_DEFAULT_PROVIDER: "machineMt"
  TRANSLATION_FRONTEND_DIR: "/app/frontend"
