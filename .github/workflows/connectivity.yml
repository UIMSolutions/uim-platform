# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: connectivity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: dlang-community/setup-dlang@4c99aa991ce7d19dd3064de0a4f2f6b2f152e2d7

    - name: 'Build & Test'
      run: |
        cd ./connectivity/backend/
        dub upgrade
        # HTTP server (REST + OData v4) and command line interface
        # (the GtkD GUI, --config=gui, needs GTK 3 development libraries)
        dub build --compiler=$DC --config=defaultRun
        dub build --compiler=$DC --config=cli
        # Unit tests: domain rules, codec, persistence, use cases, adapters, end-to-end scenario
        dub test --compiler=$DC --config=defaultTest
