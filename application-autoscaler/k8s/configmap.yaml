apiVersion: v1
kind: ConfigMap
metadata:
  name: application-autoscaler-config
  labels:
    app: application-autoscaler
    part-of: uim-platform
data:
  AUTOSCALER_HOST: "0.0.0.0"
  AUTOSCALER_PORT: "8097"
  AUTOSCALER_STORAGE: "file"
  AUTOSCALER_DATA_FILE: "/data/application-autoscaler.json"
  AUTOSCALER_FRONTEND_DIR: "/app/frontend"
  AUTOSCALER_AUTH_MODE: "jwt"
  AUTOSCALER_TOKEN_TTL_SECONDS: "3600"
  AUTOSCALER_EVALUATION_INTERVAL_SECONDS: "30"
  AUTOSCALER_METRIC_STALE_SECONDS: "600"
  AUTOSCALER_METRIC_RETENTION_HOURS: "48"
  AUTOSCALER_EVENT_RETENTION_DAYS: "30"
  # simulate | http — http posts {appGuid, instances, …} to AUTOSCALER_INSTANCE_URL
  AUTOSCALER_INSTANCE_MODE: "simulate"
  AUTOSCALER_INSTANCE_URL: ""
