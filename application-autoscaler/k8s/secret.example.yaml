# Copy to secret.yaml (not committed), fill in, apply:
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: application-autoscaler-secret
  labels:
    app: application-autoscaler
type: Opaque
stringData:
  AUTOSCALER_JWT_SECRET: "<at least 32 random characters, e.g. openssl rand -base64 48>"
  AUTOSCALER_ADMIN_PASSWORD: "<initial password of the admin user (min. 10 characters)>"
  # optional: Authorization header for the platform endpoint (instanceMode http)
  AUTOSCALER_INSTANCE_AUTHORIZATION: "Bearer <token>"
