# Placeholders and hints
idPlaceholder=generated if empty
daysOfWeekHint=1 = Monday … 7 = Sunday, or Mon, Tue …
initialMinHint=raised once when the schedule starts (0 = none)
unitHint=default for standard metrics
scaleReasonHint=why (recorded in the history)
scaleHint=Manual scaling also starts the cool-down. The next evaluation brings the instances back inside the limits.
ruleHint=The rule fires when the metric has met the threshold for the whole breach duration. After a scaling, no rule fires during its cool-down.
scheduleHint=Times are local times of the policy's time zone. While a schedule is active, its limits replace the policy's limits.
simulateHint=Records the value every few seconds over the past duration, so that a rule can fire at the next evaluation.

