unitHint=Standard bei Standardmetriken
scaleReasonHint=warum (wird in der Historie erfasst)
scaleHint=Auch manuelles Skalieren startet die Abkühlzeit. Die nächste Auswertung bringt die Instanzen wieder in die Grenzen.
ruleHint=Die Regel greift, wenn die Metrik den Schwellwert während der gesamten Überschreitungsdauer erfüllt. Nach einer Skalierung greift während der Abkühlzeit keine Regel.
scheduleHint=Zeiten sind Ortszeiten der Zeitzone der Richtlinie. Solange ein Zeitplan aktiv ist, ersetzen seine Grenzen die der Richtlinie.
simulateHint=Erfasst den Wert alle paar Sekunden über die vergangene Dauer, damit bei der nächsten Auswertung eine Regel greifen kann.

