_schema-version: "3.3"
ID: uim-identity-authentication
version: 1.0.0
description: UIM Identity Authentication — D/vibe.d backend (REST, OAuth 2.0 / OIDC, OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: ias-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-identity-authentication-platform-service dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-identity-authentication-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /api/v1/health
    properties:
      IAS_HOST: 0.0.0.0
      IAS_LOG_LEVEL: info
      # Snapshots live on the (ephemeral) container disk — bind a persistent
      # store before using this for production data.
      IAS_STORAGE: file
      IAS_DATA_DIR: data
      IAS_FRONTEND_DIR: ""
      IAS_CLEANUP_INTERVAL: "30"
    provides:
      - name: ias-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: ias-xsuaa
      - name: identity-authentication-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: ias-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: ias-xsuaa
      - name: ias-srv-api
        group: destinations
        properties:
          name: ias-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: ias-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-identity-authentication-${space}

  # Runtime settings read from VCAP_SERVICES (credentials of the service named /
  # tagged "identity-authentication-config"). The token signing secret MUST be
  # set here (≥ 16 characters) — the built-in default is for development only:
  #   cf update-user-provided-service identity-authentication-config -p '{"jwtSecret":"…"}'
  - name: identity-authentication-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: identity-authentication-config
      config:
        cleanupTenants: default
