_schema-version: "3.3"
ID: uim-agentry
version: 1.0.0
description: UIM Agentry — D/vibe.d backend (REST + OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: agentry-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-agentry-platform-service dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-agentry-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /api/v1/health
    properties:
      AGENTRY_HOST: 0.0.0.0
      AGENTRY_LOG_LEVEL: info
      # Snapshots live on the (ephemeral) container disk — bind a persistent
      # store before using this for production data.
      AGENTRY_STORAGE: file
      AGENTRY_DATA_DIR: data
      AGENTRY_FRONTEND_DIR: ""
      AGENTRY_WATCHDOG_INTERVAL: "15"
      AGENTRY_SYNC_TIMEOUT: "60"
    provides:
      - name: agentry-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: agentry-xsuaa
      - name: agentry-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: agentry-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: agentry-xsuaa
      - name: agentry-srv-api
        group: destinations
        properties:
          name: agentry-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: agentry-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-agentry-${space}

  # Optional runtime overrides read from VCAP_SERVICES (credentials of the
  # service named / tagged "agentry-config"), e.g. {"watchdogTenants": "t1,t2"}
  - name: agentry-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: agentry-config
      config:
        watchdogTenants: default
