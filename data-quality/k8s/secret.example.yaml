# Copy to secret.yaml (not committed), fill in, apply:
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: data-quality-secret
  labels:
    app: data-quality
type: Opaque
stringData:
  DQ_JWT_SECRET: "<at least 32 random characters, e.g. openssl rand -base64 48>"
  DQ_ADMIN_PASSWORD: "<initial password of the admin user (min. 10 characters)>"
