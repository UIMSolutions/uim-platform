_schema-version: "3.3"
ID: uim-identity-provisioning
version: 1.0.0
description: UIM Identity Provisioning — D/vibe.d backend (REST + OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: identity-provisioning-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-identity-provisioning-platform-service dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-identity-provisioning-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /api/v1/health
    properties:
      IPS_HOST: 0.0.0.0
      IPS_LOG_LEVEL: info
      # Snapshots live on the (ephemeral) container disk — bind a persistent
      # store before using this for real data.
      IPS_STORAGE: file
      IPS_DATA_DIR: data
      IPS_FRONTEND_DIR: ""
      IPS_DEMO_DATA: "false"
      IPS_SCHEDULER_INTERVAL: "30"
    provides:
      - name: identity-provisioning-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: identity-provisioning-xsuaa
      - name: identity-provisioning-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: identity-provisioning-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: identity-provisioning-xsuaa
      - name: identity-provisioning-srv-api
        group: destinations
        properties:
          name: identity-provisioning-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 120000

resources:
  - name: identity-provisioning-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-identity-provisioning-${space}

  # Optional runtime overrides read from VCAP_SERVICES (credentials of the
  # service named / tagged "identity-provisioning-config"), e.g. {"logRetentionDays": "90"}
  - name: identity-provisioning-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: identity-provisioning-config
      config:
        schedulerTenants: default
        logRetentionDays: "30"
