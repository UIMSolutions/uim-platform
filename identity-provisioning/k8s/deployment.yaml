apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-provisioning
  labels:
    app: identity-provisioning
    part-of: uim-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-provisioning
  template:
    metadata:
      labels:
        app: identity-provisioning
    spec:
      containers:
      - name: identity-provisioning
        image: uim-platform/identity-provisioning:latest
        ports:
        - containerPort: 8093
          protocol: TCP
        envFrom:
        - configMapRef:
            name: identity-provisioning-config
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8093
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8093
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        # JSON snapshots (systems, jobs, delta state, logs); replace with a
        # PersistentVolumeClaim to keep data across restarts
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        emptyDir: {}
