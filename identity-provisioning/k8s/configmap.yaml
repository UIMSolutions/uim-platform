apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-provisioning-config
  labels:
    app: identity-provisioning
    part-of: uim-platform
data:
  IPS_HOST: "0.0.0.0"
  IPS_PORT: "8093"
  IPS_LOG_LEVEL: "info"
  IPS_STORAGE: "file"
  IPS_DATA_DIR: "/app/data"
  IPS_DEFAULT_TENANT: "default"
  IPS_SCHEDULER_INTERVAL: "30"
  IPS_SCHEDULER_TENANTS: "default"
  IPS_LOG_RETENTION_DAYS: "30"
  IPS_DEMO_DATA: "false"
  IPS_FRONTEND_DIR: "/app/frontend"
