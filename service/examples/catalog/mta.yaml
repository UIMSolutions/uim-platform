_schema-version: "3.3"
ID: uim-catalog
version: 1.0.0
description: uim-platform catalog reference service — D/vibe.d backend (OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: catalog-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=server
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-catalog-server dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-catalog-server
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      CATALOG_HOST: 0.0.0.0
      CATALOG_FRONTEND_DIR: ""
      # The file store lives on the ephemeral container disk — bind a database
      # (IDocumentStore implementation) before storing real data.
      CATALOG_STORAGE: file
    provides:
      - name: catalog-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: catalog-xsuaa   # verificationkey → RS256 token validation + scope enforcement

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: catalog-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: catalog-xsuaa
      - name: catalog-srv-api
        group: destinations
        properties:
          name: catalog-srv
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: catalog-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-catalog-${space}
