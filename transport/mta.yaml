_schema-version: "3.3"
ID: uim-transport
version: 2.0.0
description: UIM Cloud Transport Management — D/vibe.d backend (REST + OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: transport-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-transport-platform-service dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-transport-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /api/v1/health
    properties:
      TM_HOST: 0.0.0.0
      TM_LOG_LEVEL: info
      # Snapshots live on the (ephemeral) container disk — bind a persistent
      # store before using this for real transports.
      TM_STORAGE: file
      TM_DATA_DIR: data
      TM_FRONTEND_DIR: ""
      TM_AUTO_IMPORT_INTERVAL: "15"
    provides:
      - name: transport-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: transport-xsuaa
      - name: transport-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: transport-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: transport-xsuaa
      - name: transport-srv-api
        group: destinations
        properties:
          name: transport-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 120000

resources:
  - name: transport-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-transport-${space}

  # Optional runtime overrides read from VCAP_SERVICES (credentials of the
  # service named / tagged "transport-config"), e.g. {"autoImportTenants": "t1,t2"}
  - name: transport-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: transport-config
      config:
        autoImportTenants: default
