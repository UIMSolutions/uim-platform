_schema-version: "3.3"
ID: uim-auditlog
version: 1.0.0
description: UIM Audit Log — D/vibe.d backend (REST + OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: auditlog-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-auditlog-platform-service dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-auditlog-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /api/v1/health
    properties:
      AL_HOST: 0.0.0.0
      AL_LOG_LEVEL: info
      # Snapshots live on the (ephemeral) container disk — bind a persistent
      # store before using this for real audit data.
      AL_STORAGE: file
      AL_DATA_DIR: data
      AL_FRONTEND_DIR: ""
      AL_RETENTION_INTERVAL: "1440"
    provides:
      - name: auditlog-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: auditlog-xsuaa
      - name: auditlog-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: auditlog-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: auditlog-xsuaa
      - name: auditlog-srv-api
        group: destinations
        properties:
          name: auditlog-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: auditlog-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-auditlog-${space}

  # Optional runtime overrides read from VCAP_SERVICES (credentials of the
  # service named / tagged "auditlog-config"), e.g. {"retentionTenants": "t1,t2"}
  - name: auditlog-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: auditlog-config
      config:
        retentionTenants: default
