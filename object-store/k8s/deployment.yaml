apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-object-store
  labels:
    app: cloud-object-store
    part-of: uim-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-object-store
  template:
    metadata:
      labels:
        app: cloud-object-store
    spec:
      containers:
      - name: cloud-object-store
        image: uim-platform/cloud-object-store:latest
        ports:
        - containerPort: 8092
          protocol: TCP
        envFrom:
        - configMapRef:
            name: cloud-object-store-config
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8092
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8092
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        # JSON snapshots and object content (blobs); replace with a
        # PersistentVolumeClaim to keep data across restarts
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        emptyDir: {}
