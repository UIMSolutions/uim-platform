_schema-version: "3.3"
ID: uim-object-store
version: 1.0.0
description: UIM Object Store — D/vibe.d backend (REST, content API, OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: object-store-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-object-store-platform-service dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-object-store-platform-service
      memory: 512M
      disk-quota: 2G
      health-check-type: http
      health-check-http-endpoint: /api/v1/health
    properties:
      OBJSTORE_HOST: 0.0.0.0
      OBJSTORE_LOG_LEVEL: info
      # Snapshots and blobs live on the (ephemeral) container disk — bind a
      # persistent volume or replace the blob storage adapter before using
      # this for real data.
      OBJSTORE_STORAGE: file
      OBJSTORE_DATA_DIR: data
      OBJSTORE_FRONTEND_DIR: ""
      OBJSTORE_LIFECYCLE_INTERVAL: "3600"
    provides:
      - name: object-store-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: object-store-xsuaa
      - name: object-store-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: object-store-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: object-store-xsuaa
      - name: object-store-srv-api
        group: destinations
        properties:
          name: object-store-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 120000

resources:
  - name: object-store-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-object-store-${space}

  # Optional runtime overrides read from VCAP_SERVICES (credentials of the
  # service named / tagged "object-store-config"), e.g. {"maxObjectSize": "104857600"}
  - name: object-store-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: object-store-config
      config:
        lifecycleTenants: default
        providers: aws,azure,gcp
        defaultRegion: eu-central-1
        maxObjectSize: "67108864"
