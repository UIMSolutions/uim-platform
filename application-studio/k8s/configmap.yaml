apiVersion: v1
kind: ConfigMap
metadata:
  name: application-studio-config
  namespace: uim-platform
  labels:
    app: application-studio
    part-of: uim-platform
data:
  APPLICATION_STUDIO_HOST: "0.0.0.0"
  APPLICATION_STUDIO_PORT: "8111"
  APPLICATION_STUDIO_LOG_LEVEL: "info"
  APPLICATION_STUDIO_STORAGE: "file"
  APPLICATION_STUDIO_DATA_DIR: "/data"
  APPLICATION_STUDIO_FRONTEND_DIR: ""
  APPLICATION_STUDIO_RECONCILE_INTERVAL: "10"
  APPLICATION_STUDIO_SEED_CATALOG: "true"
