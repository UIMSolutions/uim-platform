apiVersion: v1
kind: ConfigMap
metadata:
  name: authorization-config
data:
  AUTHORIZATION_HOST: "0.0.0.0"
  AUTHORIZATION_PORT: "8117"
  AUTHORIZATION_LOG_LEVEL: "info"
  # memory | file | mongodb (legacy AUTHORIZATION_STORAGE_BACKEND / AUTHORIZATION_FILE_PATH still work)
  AUTHORIZATION_STORAGE: "memory"
  AUTHORIZATION_DATA_FILE: "/data/authorization.json"
  AUTHORIZATION_MONGO_URI: "mongodb://mongodb:27017"
  AUTHORIZATION_MONGO_DB: "uim_authorization"
  AUTHORIZATION_MONGO_COLLECTION: "documents"
  AUTHORIZATION_DEFAULT_TENANT: "default"
  AUTHORIZATION_FRONTEND_DIR: ""
  AUTHORIZATION_RECORD_DECISIONS: "true"
  AUTHORIZATION_DECISION_RETENTION_DAYS: "90"
  AUTHORIZATION_DECISION_PRUNE_MINUTES: "1440"
  AUTHORIZATION_SEED_BASE_POLICIES: "true"
  AUTHORIZATION_SEED_TENANT_ID: "default"
  AUTHORIZATION_SEED_APP_NAME: "authorization-management"
  AUTHORIZATION_SEED_ORGANIZATION_ID: "global"
  AUTHORIZATION_SEED_DEMO_DATA: "false"
