_schema-version: "3.3"
ID: uim-authorization
version: 2.0.0
description: UIM Authorization Management — D/vibe.d backend (JSON API, REST, OData v4, dashboard), SAP Fiori 3 app and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: authorization-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-authorization-platform-service dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-authorization-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      AUTHORIZATION_HOST: 0.0.0.0
      AUTHORIZATION_LOG_LEVEL: info
      # The JSON snapshot lives on the (ephemeral) container disk — use
      # AUTHORIZATION_STORAGE=mongodb (+ AUTHORIZATION_MONGO_URI) for real data.
      AUTHORIZATION_STORAGE: file
      AUTHORIZATION_DATA_FILE: data/authorization.json
      AUTHORIZATION_FRONTEND_DIR: ""
      AUTHORIZATION_SEED_DEMO_DATA: "false"
      AUTHORIZATION_DECISION_PRUNE_MINUTES: "1440"
    provides:
      - name: authorization-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: authorization-xsuaa
      - name: authorization-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: authorization-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: authorization-xsuaa
      - name: authorization-srv-api
        group: destinations
        properties:
          name: authorization-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: authorization-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-authorization-${space}

  # Optional runtime overrides read from VCAP_SERVICES (credentials of the
  # user-provided service "authorization-config"), e.g. {"decisionRetentionDays": 30}
  - name: authorization-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: authorization-config
      config:
        decisionRetentionDays: 90
        workerTenants: default
