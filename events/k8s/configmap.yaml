apiVersion: v1
kind: ConfigMap
metadata:
  name: uim-event-mesh-config
  namespace: uim-platform
  labels:
    app: uim-event-mesh
    part-of: uim-platform
data:
  EVENT_MESH_HOST: "0.0.0.0"
  EVENT_MESH_PORT: "8109"
  EVENT_MESH_STORAGE: "file"
  EVENT_MESH_DATA_FILE: "/data/event-mesh.json"
  EVENT_MESH_FRONTEND_DIR: "/app/frontend"
  EVENT_MESH_DELIVERY_INTERVAL_SECONDS: "10"
