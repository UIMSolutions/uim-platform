_schema-version: "3.3"
ID: uim-event-mesh
version: 2.0.0
description: UIM Event Mesh — D/vibe.d backend (REST + OData v4), SAP Fiori 3 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: event-mesh-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun --compiler=ldc2
        - dub build --build=release --config=cli --compiler=ldc2
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-event-mesh-platform-service build/uim-event-mesh-cli dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-event-mesh-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      EVENT_MESH_HOST: 0.0.0.0
      # The snapshot lives on the (ephemeral) container disk — single instance only.
      EVENT_MESH_STORAGE: file
      EVENT_MESH_DATA_FILE: data/event-mesh.json
      EVENT_MESH_FRONTEND_DIR: ""
      EVENT_MESH_DELIVERY_INTERVAL_SECONDS: "10"
    provides:
      - name: event-mesh-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: event-mesh-xsuaa
      - name: event-mesh-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: event-mesh-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: event-mesh-xsuaa
      - name: event-mesh-srv-api
        group: destinations
        properties:
          name: event-mesh-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: event-mesh-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-event-mesh-${space}

  # Optional runtime overrides read from VCAP_SERVICES (credentials of the
  # service named "event-mesh-config"), e.g. {"deliveryTenants": ["t1", "t2"]}
  - name: event-mesh-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: event-mesh-config
      config:
        deliveryTenants: ["default"]
