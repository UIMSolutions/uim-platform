workflowHint=A workflow copies the task templates of an active scenario. Systems are required when a template needs them and must match the system types of the scenario.
credentialsHint=Passwords and client secrets are never stored here. The automation reads the Authorization header from the environment variable shown in the list (IA_DESTINATION_<NAME>_AUTHORIZATION).
templatesFrozen=Task templates can only change while the scenario is a draft. Copy the scenario to create a new version.

