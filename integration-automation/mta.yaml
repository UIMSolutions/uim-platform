_schema-version: "3.3"
ID: uim-integration-automation
version: 2.0.0
description: UIM Integration Automation — D/vibe.d backend (REST, OData v4), SAP Fiori 3 / OpenUI5 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: integration-automation-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun --compiler=ldc2
        - dub build --build=release --config=cli --compiler=ldc2
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-integration-automation-platform-service build/uim-integration-automation-cli dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-integration-automation-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      IA_HOST: 0.0.0.0
      # The snapshot lives on the (ephemeral) container disk — single instance only.
      IA_STORAGE: file
      IA_DATA_FILE: data/integration-automation.json
      IA_FRONTEND_DIR: ""
      # authentication: the XSUAA binding below switches the service to xsuaa mode
      IA_AUTH_MODE: open
      IA_AUTOMATION_MODE: http
      IA_CONNECTIVITY_MODE: tcp
    provides:
      - name: integration-automation-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: integration-automation-xsuaa
      - name: integration-automation-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: integration-automation-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: integration-automation-xsuaa
      - name: integration-automation-srv-api
        group: destinations
        properties:
          name: integration-automation-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 120000

resources:
  - name: integration-automation-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-integration-automation-${space}

  # Runtime overrides read from VCAP_SERVICES (credentials of the service named
  # "integration-automation-config"), e.g.:
  #   cf update-user-provided-service integration-automation-config -p '{"maxOpenWorkflows":20,"notificationWebhookUrl":"https://…"}'
  - name: integration-automation-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: integration-automation-config
      config:
        workerTenants: ["default"]
