# Copy to secret.yaml (not committed), fill in, apply:
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: application-events-secret
  namespace: uim-platform
  labels:
    app: application-events-service
type: Opaque
stringData:
  APPEVENTS_JWT_SECRET: "<at least 32 random characters, e.g. openssl rand -base64 48>"
  APPEVENTS_ADMIN_PASSWORD: "<initial password of the admin user (min. 10 characters)>"
  # optional: Authorization header sent to the webhook endpoints (deliveryMode http)
  APPEVENTS_DELIVERY_AUTHORIZATION: "Bearer <token>"
