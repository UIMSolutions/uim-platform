apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasphere-service
  namespace: uim-platform
  labels:
    app: datasphere-service
    part-of: uim-platform
spec:
  # file storage is a single-node snapshot — keep one replica
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: datasphere-service
  template:
    metadata:
      labels:
        app: datasphere-service
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
      containers:
      - name: datasphere-service
        image: uim-platform/datasphere:latest
        ports:
        - containerPort: 8095
          protocol: TCP
        envFrom:
        - configMapRef:
            name: datasphere-config
        - secretRef:
            name: datasphere-secret
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8095
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8095
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: datasphere-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datasphere-data
  namespace: uim-platform
  labels:
    app: datasphere-service
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
