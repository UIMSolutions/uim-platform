_schema-version: "3.3"
ID: uim-datasphere
version: 2.0.0
description: UIM Datasphere — D/vibe.d backend (REST, OData v4), SAP Fiori 3 / OpenUI5 UI and approuter

parameters:
  enable-parallel-deployments: true

modules:
  # ── D / vibe.d backend ────────────────────────────────────────────────────
  - name: datasphere-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands:
        - dub build --build=release --config=defaultRun --compiler=ldc2
        - dub build --build=release --config=cli --compiler=ldc2
        - rm -rf dist && mkdir -p dist/config
        - cp build/uim-datasphere-platform-service build/uim-datasphere-cli dist/
        - cp config/default.json dist/config/
      build-result: dist
    parameters:
      buildpack: binary_buildpack
      command: ./uim-datasphere-platform-service
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      DATASPHERE_HOST: 0.0.0.0
      # The snapshot lives on the (ephemeral) container disk — single instance only.
      DATASPHERE_STORAGE: file
      DATASPHERE_DATA_FILE: data/datasphere.json
      DATASPHERE_FRONTEND_DIR: ""
      # authentication: the XSUAA binding below switches the service to xsuaa mode
      DATASPHERE_AUTH_MODE: open
      DATASPHERE_SCHEDULER_INTERVAL_SECONDS: 60
    provides:
      - name: datasphere-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: datasphere-xsuaa
      - name: datasphere-config

  # ── Approuter (serves the Fiori app from resources/) ──────────────────────
  - name: datasphere-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - cp -r ../frontend resources
        - rm -rf resources/test resources/localService resources/node_modules resources/dist
        - npm install --omit=dev
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: datasphere-xsuaa
      - name: datasphere-srv-api
        group: destinations
        properties:
          name: datasphere-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 60000

resources:
  - name: datasphere-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
      config:
        xsappname: uim-datasphere-${space}

  # Runtime overrides read from VCAP_SERVICES (credentials of the service named
  # "datasphere-config"), e.g.:
  #   cf update-user-provided-service datasphere-config \
  #     -p '{"runRetentionDays":90,"schedulerIntervalSeconds":30,"enforceQuota":true}'
  - name: datasphere-config
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: datasphere-config
      config:
        workerTenants: ["default"]
